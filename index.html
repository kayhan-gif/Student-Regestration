<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>

    <div class="row">
        <div class="col-3"></div>
        <div class="col-4" t p-5 mt-5>
            <form class="p-5 bg-light border border-dark rounded" onreset="return cheeeck()">
                <div class="form-group mb-3">
                    <label for="exampleInputEmail">Name:</label>
                    <input type="text" class="form-control" id="name" arial-describedby="emailHelp" placeholder="Name">
                </div>
                <div class="form-group mb-3">
                    <label for="exampleInputPassword1">Last Name:</label>
                    <input type="text" class="form-control" id="lastname" arial-describedby="emailHelp"
                        placeholder="Last Name">
                </div>
                <div class="form-group mb-3">
                    <label for="exampleInputPassword1">Father Name:</label>
                    <input type="text" class="form-control" id="fathername" arial-describedby="emailHelp"
                        placeholder="Father Name">
                </div>
                <div class="form-group mb-3">
                    <label for="exampleInputPassword1">Province:</label>
                    <input type="text" class="form-control" id="province" arial-describedby="emailHelp"
                        placeholder="Province Name">
                </div>

                <button type="button" class="btn btn-primary" onclick="savedata()">Save</button>
                <button type="reset" class="btn btn-primary" >Reset</button>
            </form>
        </div>

        <div class="col-4 p-5 mt-5">
            <table class="table">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">Father Name</th>
                        <th scope="col">Province</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="name-t"></td>
                        <td id="lastname-t"></td>
                        <td id="fathername-t"></td>
                        <td id="province-t"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>

            function cheeeck(){
                let ch = confirm("Are you sure ?")
                if(ch){
                    return true
                }
                else {
                    return false
                }
            }

            let savedata = function() {
            let namee = document.getElementById("name").value;
            let lastNamee = document.getElementById("lastname").value;
            let fatherNamee = document.getElementById("fathername").value;
            let provincee = document.getElementById("province").value;

            document.getElementById('name-t').innerHTML = namee;
            document.getElementById('lastname-t').innerHTML = lastNamee;
            document.getElementById('fathername-t').innerHTML = fatherNamee;
            document.getElementById('province-t').innerHTML = provincee;
        }

    </script>
</body>

</html>
